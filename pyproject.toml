[project]
name = "zendesk-mcp-server"
version = "0.1.0"
description = "A simple Zendesk MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.1.2",
    "python-dotenv>=1.0.1",
    "zenpy>=2.0.56",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-dotenv>=0.5",
]

[tool.pytest.ini_options]
env_files = [".env"]

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-dotenv>=0.5.2",
]

[project.scripts]
zendesk = "zendesk_mcp_server:main"
